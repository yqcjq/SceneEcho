[project]
name = "sceneecho-backend"
version = "0.1.0"
description = "SceneEcho Python backend (FastAPI)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.1",
    "python-multipart>=0.0.12",
    "structlog>=24.4.0",
    "apscheduler>=3.10.4",
    "typer>=0.13.0",
    "imageio-ffmpeg>=0.5.1",
    "sse-starlette>=2.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.7.0",
]
# Heavy ML libraries used only by Phase 1A subcapability modules. Lazy-imported
# inside each module so the base install / unit tests don't pay the install
# tax. CI integration jobs install with ``pip install -e .[dev,extract]``.
extract = [
    "scenedetect>=0.6.4",
    "opencv-python-headless>=4.10.0",
    "numpy>=1.26.0",
    "librosa>=0.10.2",
    "soundfile>=0.12.1",
    "demucs>=4.0.1",
    "torch>=2.1.0",
    "torchaudio>=2.1.0",
    "Pillow>=10.4.0",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
